name: Death Atlas availability
run-name: "${{ inputs.simulate_failure && '[TEST] ' || '' }}Death Atlas availability"

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Controlled test: fail using synthetic responses, without changing production'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: death-atlas-availability
  cancel-in-progress: false

jobs:
  check:
    name: Check API and published edition
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read monitoring source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            monitoring/src/monitor-core.ts
            monitoring/tools/github-monitor.mjs
          sparse-checkout-cone-mode: false
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify public service with one retry
        env:
          SIMULATE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure && 'true' || 'false' }}
        run: node monitoring/tools/github-monitor.mjs
