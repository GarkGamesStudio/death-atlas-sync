name: Build Linux desktop preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Desktop prerequisites
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11 gnome-keyring libsecret-1-0 python3-tk
      - name: Pinned dependencies
        run: python -m pip install --only-binary=cryptography -r requirements-posix.txt
      - name: Security, recovery and service contracts
        run: |
          python tests/platform_tests.py
          python tests/linux_credentials_tests.py
          python tests/languages.py
          python tests/discovery_tests.py
          python tests/erasure.py
          python tests/policy_tests.py
      - name: Native desktop recovery and packaged program
        run: |
          dbus-run-session -- xvfb-run -a bash -e -c '
            python tests/linux_desktop_tests.py
            printf "fixture-only-password" | gnome-keyring-daemon --unlock --components=secrets
            python tools/build_posix.py
          '
      - uses: actions/upload-artifact@v4
        with:
          name: DeathAtlasSync-Linux-x64
          path: release/
          if-no-files-found: error
          retention-days: 14
