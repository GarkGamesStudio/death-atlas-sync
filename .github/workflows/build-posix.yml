name: Build macOS and Linux previews
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: Linux-x64
          - os: macos-15-intel
            target: macOS-x64
          - os: macos-14
            target: macOS-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Linux desktop test prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11 gnome-keyring libsecret-1-0 python3-tk
      - name: Install pinned build dependencies
        run: python -m pip install --only-binary=cryptography -r requirements-posix.txt
      - name: Portable security and contract tests
        run: |
          python tests/platform_tests.py
          python tests/languages.py
          python tests/discovery_tests.py
          python tests/prelaunch_updates.py
          python tests/setup_diagnostics.py
          python tests/erasure.py
          python tests/policy_tests.py
      - name: Linux keyring recovery contracts
        if: runner.os == 'Linux'
        run: python tests/linux_credentials_tests.py
      - name: Build and launch Linux executable with isolated desktop keyring
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- xvfb-run -a bash -e -c '
            python tests/linux_desktop_tests.py
            python tests/compact_setup.py
            python tests/localized_windows.py
            printf "fixture-only-password" | gnome-keyring-daemon --unlock --components=secrets
            python tools/build_posix.py
          '
      - name: Build and launch macOS application
        if: runner.os == 'macOS'
        run: |
          python tests/compact_setup.py
          python tests/localized_windows.py
          python tools/build_posix.py
      - uses: actions/upload-artifact@v4
        with:
          name: DeathAtlasSync-${{ matrix.target }}
          path: release/
          if-no-files-found: error
          retention-days: 14
