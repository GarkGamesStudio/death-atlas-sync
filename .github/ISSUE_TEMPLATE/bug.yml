name: Report a bug / Reportar un error
description: Death Atlas addon, Sync for Windows/macOS/Linux, or web dashboard
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Official WoW Forever validation is pending. macOS/Linux builds have not been tested with WoW. Do not upload SavedVariables, settings.dpapi, settings.enc, tokens, full histories, or private account paths. Crop screenshots before attaching them."
  - type: dropdown
    id: component
    attributes:
      label: Component / Componente
      options: [WoW addon, Windows Sync, macOS Sync, Linux Sync, Web dashboard]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and client / Versión y cliente
      description: "Include your OS and architecture: e.g. Sync 0.4.1, macOS 14 Apple Silicon; Linux x64 with GNOME/X11. No account names."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and result / Pasos y resultado
      description: What did you do, what did you expect, and what happened?
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error code / Código de error
      description: Optional short error code or cropped screenshot. Review it for private data first.
